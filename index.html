<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Culturizando Pibes: Gran Sesión #03 (100 Preguntas)</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 15%, #18181b 0%, #0c0c0e 55%, #050505 100%);
      --glass-bg: rgba(24, 24, 27, 0.88);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 20px 48px rgba(0, 0, 0, 0.8);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      --accent-blue: #3b82f6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 80px 16px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 680px;
      position: relative;
      z-index: 1;
    }
    /* Top Bar flotante */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 10px 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .nav-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.12); }
    .nav-center {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select.nav-select {
      background: #111;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }
    /* Tarjeta principal */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--glass-shadow);
      margin-bottom: 16px;
    }
    .badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--accent-blue);
    }
    .qid-badge {
      color: var(--text-muted);
      font-family: monospace;
      font-size: 12px;
    }
    .pregunta-texto {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 20px;
      color: #fafafa;
    }
    .turno-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .turno-label {
      font-size: 13px;
      color: var(--text-muted);
    }
    .turno-player {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
    }
    /* Acciones de acierto */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn-action {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-acierto {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .btn-acierto.active {
      background: var(--accent-emerald);
      color: #000;
    }
    .btn-fallo {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fb7185;
    }
    .btn-fallo.active {
      background: var(--accent-rose);
      color: #fff;
    }
    /* Revelar respuesta */
    .reveal-btn {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px dashed rgba(255,255,255,0.2);
      color: var(--text-main);
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .reveal-box {
      display: none;
      background: rgba(0,0,0,0.4);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .reveal-resp {
      font-size: 17px;
      font-weight: bold;
      color: #6ee7b7;
      margin-bottom: 8px;
    }
    .reveal-host {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }
    /* Barra de Valoración y Reporte */
    .feedback-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .val-btns {
      display: flex;
      gap: 8px;
    }
    .val-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .val-btn.selected-like {
      background: rgba(16, 185, 129, 0.25);
      border-color: var(--accent-emerald);
      color: #34d399;
    }
    .val-btn.selected-dislike {
      background: rgba(244, 63, 94, 0.25);
      border-color: var(--accent-rose);
      color: #fb7185;
    }
    .btn-report {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
    }
    /* Modal de Reporte / Etiquetas */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: #18181b;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      max-width: 440px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .tag-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tag-chip {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-muted);
    }
    .tag-chip.active {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--accent-amber);
      color: #fde68a;
    }
    .modal-textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      padding: 10px;
      font-size: 13px;
      resize: vertical;
      min-height: 60px;
      margin-bottom: 16px;
      font-family: inherit;
      outline: none;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    /* Botón Flotante Permanente */
    .floating-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 680px;
      z-index: 50;
    }
    .btn-copiar-resumen {
      width: 100%;
      background: #fafafa;
      color: #09090b;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .toast {
      display: none;
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: #000;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      z-index: 200;
    }
  </style>
</head>
<body>

  <div class="toast" id="toast">✅ Resumen JSON copiado al portapapeles</div>

  <div class="container">
    <!-- Top Nav con Selector y Salto Libre -->
    <div class="top-nav">
      <button class="nav-btn" onclick="cambiarPregunta(-1)">← Anterior</button>
      <div class="nav-center">
        <select class="nav-select" id="selector-pregunta" onchange="irAPregunta(this.value)"></select>
      </div>
      <button class="nav-btn" onclick="cambiarPregunta(1)">Siguiente →</button>
    </div>

    <!-- Tarjeta de Pregunta Actual -->
    <div class="card" id="card-pregunta">
      <div class="badge-row">
        <span class="badge" id="badge-cat">Categoría</span>
        <span class="qid-badge" id="badge-qid">Q-0000</span>
      </div>

      <div class="pregunta-texto" id="txt-pregunta">Cargando pregunta...</div>

      <!-- Turno asignado -->
      <div class="turno-box">
        <span class="turno-label">🎯 Turno de:</span>
        <select class="nav-select" id="select-jugador" onchange="asignarJugador(this.value)"></select>
      </div>

      <!-- Acierto / Fallo -->
      <div class="action-grid">
        <button class="btn-action btn-acierto" id="btn-acierto" onclick="marcarAcierto(true)">
          ✓ Acertó (+1)
        </button>
        <button class="btn-action btn-fallo" id="btn-fallo" onclick="marcarAcierto(false)">
          ✗ Falló
        </button>
      </div>

      <!-- Revelar Respuesta y Host -->
      <button class="reveal-btn" id="btn-revelar" onclick="toggleRespuesta()">👁️ Revelar Respuesta y Host</button>
      <div class="reveal-box" id="box-respuesta">
        <div class="reveal-resp" id="txt-respuesta">Respuesta</div>
        <div class="reveal-host" id="txt-host">Comentario del Host</div>
      </div>

      <!-- Valoración & Reporte -->
      <div class="feedback-row">
        <div class="val-btns">
          <button class="val-btn" id="btn-like" onclick="valorar('like')">👍 Like</button>
          <button class="val-btn" id="btn-dislike" onclick="valorar('dislike')">👎 Dislike</button>
        </div>
        <button class="btn-report" onclick="abrirModalReporte()">💬 Comentario / Reportar</button>
      </div>
    </div>
  </div>

  <!-- Botón Flotante Permanente -->
  <div class="floating-bar">
    <button class="btn-copiar-resumen" onclick="copiarResumen()">
      📋 Copiar Resumen JSON (Accesible siempre)
    </button>
  </div>

  <!-- Modal de Reporte / Etiquetas -->
  <div class="modal-overlay" id="modal-reporte">
    <div class="modal-box">
      <div class="modal-title">Reportar / Comentario sobre la pregunta</div>
      <div class="tag-grid">
        <div class="tag-chip" onclick="toggleTag(this, 'muy_larga')">Muy larga</div>
        <div class="tag-chip" onclick="toggleTag(this, 'spoiler_enunciado')">Spoiler en enunciado</div>
        <div class="tag-chip" onclick="toggleTag(this, 'dato_dudoso')">Dato dudoso</div>
        <div class="tag-chip" onclick="toggleTag(this, 'repetida')">Repetida</div>
        <div class="tag-chip" onclick="toggleTag(this, 'tema_flojo')">Tema flojo</div>
      </div>
      <textarea class="modal-textarea" id="modal-comentario" placeholder="Comentario libre opcional..."></textarea>
      <div class="modal-actions">
        <button class="nav-btn" onclick="cerrarModalReporte()">Cancelar</button>
        <button class="nav-btn" style="background:#fff; color:#000;" onclick="guardarReporte()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const PREGUNTAS = [{"id": "Q-0151", "categoria": "Cine, Series de TV & Entretenimiento", "dificultad": "Elevada", "pregunta": "¿En qué ciudad ficticia de Nuevo México transcurre la trama criminal de Walter White en la serie 'Breaking Bad'?", "respuesta_correcta": "Albuquerque", "comentario_host": "Cocinar metanfetamina azul en una caravana en el desierto.", "fuentes": ["Enciclopedia Británica", "Archivo Histórico"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 0, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0024", "categoria": "Cultura Geek / Frikadas", "dificultad": "Elevada", "pregunta": "En la monumental saga 'Dune' de Frank Herbert, ¿cómo se llama el planeta desértico (también conocido por su nombre nativo) donde se extrae la codiciada especia melange?", "respuesta_correcta": "Arrakis (o Dune)", "comentario_host": "El planeta de los gusanos de arena Shai-Hulud y de los Fremen. El que controla la especia controla el universo.", "fuentes": ["Frank Herbert, 'Dune' (1965)", "The Dune Encyclopedia"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 1, "dislikes": 0, "reportes": []}}, {"id": "Q-0152", "categoria": "Cultura Geek / Frikadas", "dificultad": "Elevada", "pregunta": "En el universo de Star Wars, ¿qué maestro Jedi de raza desconocida fue el gran líder de la Orden y entrenó a Luke Skywalker en Dagobah?", "respuesta_correcta": "Yoda", "comentario_host": "Pequeño, verde y hablando con sintaxis invertida.", "fuentes": ["Enciclopedia Británica", "Archivo Histórico"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 0, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0006", "categoria": "Cultura Pop / Gen Z / Temas Aleatorios", "dificultad": "Elevada", "pregunta": "¿En qué ciudad estadounidense se celebró entre abril y junio de 1945 la conferencia multilateral donde 50 naciones redactaron y firmaron la Carta fundacional de las Naciones Unidas?", "respuesta_correcta": "San Francisco", "comentario_host": "Ni Nueva York, ni Ginebra, ni Washington. La Carta de la ONU se firmó en San Francisco al terminar la Segunda Guerra Mundial.", "fuentes": ["United Nations Archives", "Department of State Bulletin"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 1, "dislikes": 0, "reportes": []}}, {"id": "Q-0064", "categoria": "Ciencia, Tecnología & Mecánica", "dificultad": "Elevada", "pregunta": "¿Qué médico y microbiólogo escocés descubrió en septiembre de 1928 las propiedades bactericidas del hongo 'Penicillium notatum' al contaminarse accidentalmente una placa de estafilococos en el St Mary's Hospital?", "respuesta_correcta": "Alexander Fleming", "comentario_host": "Se fue de vacaciones y dejó las placas de cultivo sin fregar en el fregadero. El hongo creció y mató a las bacterias: nació la penicilina.", "fuentes": ["Nobel Prize in Physiology or Medicine 1945", "British Journal of Experimental Pathology (1929)"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 1, "dislikes": 0, "reportes": []}}, {"id": "Q-0041", "categoria": "Ciencia, Tecnología & Mecánica", "dificultad": "Elevada", "pregunta": "¿Cómo se denominan los componentes elementales de espín 1/2 que, agrupados en tripletes o pares con antiquarks, componen los hadrones como el protón y el neutrón?", "respuesta_correcta": "Quarks", "comentario_host": "Arriba, abajo, encanto, extraño, cima y fondo. Propuestos por Murray Gell-Mann tomando el nombre de una novela de James Joyce.", "fuentes": ["Particle Data Group (PDG)", "Nobel Prize in Physics 1969"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 1, "dislikes": 0, "reportes": []}}, {"id": "Q-0001", "categoria": "Historia Universal y de España", "dificultad": "Elevada", "pregunta": "¿Qué emperador romano legalizó la práctica del cristianismo en todo el Imperio Romano mediante la promulgación del Edicto de Milán en el año 313 d.C.?", "respuesta_correcta": "Constantino I (Constantino el Grande)", "comentario_host": "A ver si os suena de algo la historia básica o pensabais que los leones del Coliseo aún siguen comiendo mártires. Constantino I en el 313. El que haya soltado Nerón o Julio César que se meta un guantazo.", "fuentes": ["Oxford Classical Dictionary", "Encyclopedia Britannica"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0025", "categoria": "Cultura Geek / Frikadas", "dificultad": "Elevada", "pregunta": "¿Qué mangaka japonés es el creador de la universal franquicia 'Dragon Ball' y del diseño de personajes de la saga de videojuegos 'Dragon Quest' y 'Chrono Trigger'?", "respuesta_correcta": "Akira Toriyama", "comentario_host": "Una leyenda que nos acompañó a todos de críos. El creador de Goku y el maestro del dibujo de acción cinético.", "fuentes": ["Shueisha Official Archives", "Toei Animation"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 1, "dislikes": 0, "reportes": []}}, {"id": "Q-0078", "categoria": "Geografía Física y Política", "dificultad": "Elevada", "pregunta": "¿Qué cadena montañosa en forma de arco de unos 1.500 kilómetros de longitud se extiende por Europa del Este a través de países como Polonia, Eslovaquia, Ucrania y Rumanía?", "respuesta_correcta": "Los Montes Cárpatos (Los Cárpatos)", "comentario_host": "Hogar del oso pardo europeo y de las leyendas de Transilvania. La segunda cordillera más larga de Europa tras los Urales.", "fuentes": ["Carpathian Convention Secretariat", "Alpine-Carpathian Geomorphology"], "estado": "activa", "motivo_revision": null, "estadisticas":  "Elevada", "pregunta": "¿Qué plataforma de venta online comenzó operando en 1994 en un garaje de Bellevue vendiendo exclusivamente libros?", "respuesta_correcta": "Amazon", "comentario_host": "Jeff Bezos empaquetando libros por el suelo.", "fuentes": ["Enciclopedia Británica", "Archivo Histórico"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 0, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0144", "categoria": "Cine, Series de TV & Entretenimiento", "dificultad": "Elevada", "pregunta": "¿Qué director firmó la conocida 'Trilogía del Dólar' protagonizada por Clint Eastwood en el desierto de Tabernas?", "respuesta_correcta": "Sergio Leone", "comentario_host": "Primerísimos planos de ojos y música de Morricone.", "fuentes": ["Enciclopedia Británica", "Archivo Histórico"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 0, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0023", "categoria": "Cultura Geek / Frikadas", "dificultad": "Elevada", "pregunta": "En el universo distópico de Warhammer 40k, ¿qué Señor de la Guerra y primarca favorito del Emperador traicionó a la Humanidad desatando la guerra civil fratricida que lleva su nombre?", "respuesta_correcta": "Horus (Horus Lupercal / La Herejía de Horus)", "comentario_host": "'Yo estaba allí el día en que Horus mató al Emperador'. Si no sabéis de Warhammer 40k es que no tenéis sangre en las venas, herejes.", "fuentes": ["Black Library - The Horus Heresy Series", "Games Workshop Lore Archives"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 1, "dislikes": 0, "reportes": []}}, {"id": "Q-0012", "categoria": "Ciencia, Tecnología & Mecánica", "dificultad": "Elevada", "pregunta": "¿Cuál es el único metal de la tabla periódica que se presenta en estado líquido en condiciones estándar de presión y temperatura (25 °C y 1 atm)?", "respuesta_correcta": "Mercurio (Hg)", "comentario_host": "¡Que no me digáis plomo ni galio! El galio se funde en tu mano a 30 °C, pero a temperatura ambiente estándar el único metal líquido es el mercurio. Catetos.", "fuentes": ["IUPAC Gold Book", "Royal Society of Chemistry"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 1, "dislikes": 0, "reportes": []}}, {"id": "Q-0038", "categoria": "Cultura Geek / Frikadas", "dificultad": "Elevada", "pregunta": "En la saga 'Canción de Hielo y Fuego' de George R.R. Martin, ¿cómo se llama la espada ancestral de acero valyrio de la Casa Stark, empuñada por Ned Stark antes de ser decapitado con ella?", "respuesta_correcta": "Hielo (Ice)", "comentario_host": "Luego Tywin Lannister la fundió para sacar dos espadas: Guardajuramentos y Lamento de Viuda. Cultura de Poniente básica.", "fuentes": ["George R.R. Martin, 'A Game of Thrones'", "The World of Ice & Fire"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 1, "dislikes": 0, "reportes": []}}, {"id": "Q-0010", "categoria": "Música", "dificultad": "Elevada", "pregunta": "¿Qué genial compositor austríaco del Clasicismo compuso la serenata 'Eine kleine Nachtmusik' (Pequeña serenata nocturna) y la ópera bufa 'Las bodas de Fígaro' antes de morir prematuramente a los 35 años?", "respuesta_correcta": "Wolfgang Amadeus Mozart", "comentario_host": "A los 5 años ya componía y tocaba el clavicordio en las cortes reales europeas. Mozart. Vosotros a los 25 años todavía no sabéis hacer una tortilla sin quemar la sartén.", "fuentes": ["Internationale Stiftung Mozarteum Salzburg", "The New Grove Dictionary of Music"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 1, "dislikes": 0, "reportes": []}}, {"id": "Q-0125", "categoria": "Marcas, Empresas e Iconos Globales", "dificultad": "Elevada", "pregunta": "¿Qué animal mitológico conforma el escudo corporativo del fabricante alemán de automóviles Porsche?", "respuesta_correcta": "Un caballo (corcel del escudo de Stuttgart)", "comentario_host": "El escudo de la ciudad de Stuttgart incrustado en el capó.", "fuentes": ["Enciclopedia Británica", "Archivo Histórico"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 0, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0155", "categoria": "Cultura Geek / Frikadas", "dificultad": "Elevada", "pregunta": "En el lore de Warhammer 40.000, ¿qué Primarca favorito del Emperador lideró la gran traición que sumió a la galaxia en la guerra civil?", "respuesta_correcta": "Horus (Horus Lupercal)", "comentario_host": "La Herejía de Horus, la mayor puñalada trapera espacial.", "fuentes": ["Enciclopedia Británica", "Archivo Histórico"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 0, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0015", "categoria": "Cultura Pop / Gen Z / Temas Aleatorios", "dificultad": "Elevada", "pregunta": "¿Qué célebre poetisa lírica de la antigua Grecia, nacida en la isla de Lesbos hacia el 630 a.C., fue denominada por Platón como 'la décima Musa' por la exquisitez de sus odas y fragmentos?", "respuesta_correcta": "Safo (o Safo de Lesbos)", "comentario_host": "Marta, te toca demostrar que no estás en los Butaneros solo para ver cómo nos insultamos. Safo de Lesbos. Si has dicho Homero o Afrodita, confirmas el mote que te tienen puesto los cabrones estos.", "fuentes": ["The Oxford Classical Dictionary", "Penguin Classics: Greek Lyric Poetry"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 1, "dislikes": 0, "reportes": []}}, {"id": "Q-0018", "categoria": "Historia Universal y de España", "dificultad": "Elevada", "pregunta": "¿Qué tratado firmado en febrero de 1992 en una ciudad de los Países Bajos transformó formalmente la Comunidad Económica Europea en la Unión Europea y sentó las bases de la moneda única (el euro)?", "respuesta_correcta": "Tratado de Maastricht (Tratado de la Unión Europea)", "comentario_host": "El tratado fundacional de la UE que definió los tres pilares comunitarios y los criterios de convergencia económica.", "fuentes": ["Diario Oficial de la Unión Europea (DO C 191)", "Consejo Europeo"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 1, "dislikes": 0, "reportes": []}}, {"id": "Q-0001", "categoria": "Historia Universal y de España", "dificultad": "Elevada", "pregunta": "¿En qué batalla naval del año 31 a.C. las fuerzas de Octavio derrotaron a las flotas de Marco Antonio y Cleopatra VII, sellando el fin de la República Romana?", "respuesta_correcta": "Batalla de Accio (o Actium)", "comentario_host": "A ver si os suena de algo Roma o solo sabéis ver memes de gladiadores. Marco Antonio y Cleopatra salieron por patas en Accio. El que haya dicho Salamina o Lepanto que se lo haga mirar.", "fuentes": ["Oxford Classical Dictionary", "Encyclopedia Britannica"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0006", "categoria": "Historia Universal y de España", "dificultad": "Elevada", "pregunta": "¿En qué año exacto se celebraron las primeras elecciones municipales democráticas en España tras el franquismo, en las que Tierno Galván llegó a la alcaldía de Madrid mediante pacto?", "respuesta_correcta": "1979 (3 de abril de 1979)", "comentario_host": "Para todos los chavales de Madrid: el 'Viejo Profesor' Enrique Tierno Galván no cayó del cielo en los 80, entró en abril de 1979. Si habéis dicho 1978 u 82, devolved el abono transporte de la EMT.", "fuentes": ["Ministerio del Interior - Archivo Histórico Electoral", "Ayun ": {"veces_jugada": 0, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0114", "categoria": "Deportes", "dificultad": "Elevada", "pregunta": "¿En qué prueba atlética estableció Bob Beamon su plusmarca mundial de 8,90 metros en los Juegos Olímpicos de México 1968?", "respuesta_correcta": "Salto de longitud", "comentario_host": "Saltó al siglo XXI de un solo brinco.", "fuentes": ["Enciclopedia Británica", "Archivo Histórico"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 0, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0130", "categoria": "Música", "dificultad": "Elevada", "pregunta": "¿Qué compositor polaco de la era romántica compuso casi la totalidad de su obra para piano solo, incluyendo célebres nocturnos y polonesas?", "respuesta_correcta": "Frédéric Chopin", "comentario_host": "Poesía al piano mientras se moría de tuberculosis.", "fuentes": ["Enciclopedia Británica", "Archivo Histórico"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 0, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0097", "categoria": "Música", "dificultad": "Elevada", "pregunta": "¿Qué pianista y compositor polaco del Romanticismo compuso célebres nocturnos, polonesas y baladas dedicadas a la independencia de su patria natal, viviendo exiliado en París?", "respuesta_correcta": "Frédéric Chopin (Fryderyk Chopin)", "comentario_host": "El poeta del piano por excelencia. Murió de tuberculosis en París y pidió que su corazón fuera enterrado en Varsovia.", "fuentes": ["The Fryderyk Chopin Institute (Varsovia)", "The New Grove Dictionary of Music"], "estado": "activa", "motivo_revision": null, "estadisticas": {"veces_jugada": 1, "aciertos": 0, "fallos": 0, "likes": 0, "dislikes": 0, "reportes": []}}, {"id": "Q-0033", "categoria": "Cultura Geek / Frikadas", "dificultad": "Elevada", "pregunta": "¿Cómo se llama el científico y físico     const BUTANEROS = ["Victor", "Llopis", "Parra", "Huerta", "Andrés", "Marta", "JAE", "Adri", "Mandres", "Sergio Díez", "Garrido", "Gonzalito", "Cadenas", "Jorge"];
    
    // Estado en memoria de la sesión
    let indiceActual = 0;
    const estadoRespuestas = PREGUNTAS.map((p, idx) => ({
      id: p.id || `Q-${String(idx+1).padStart(4, '0')}`,
      jugador: BUTANEROS[idx % BUTANEROS.length],
      acierto: null,
      val: "sin_valorar",
      etiquetas: [],
      comentario: ""
    }));

    function init() {
      const sel = document.getElementById("selector-pregunta");
      sel.innerHTML = "";
      PREGUNTAS.forEach((p, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `${i+1}. [${p.id || 'Q'} - ${p.categoria || 'Gen'}]`;
        sel.appendChild(opt);
      });

      const selJ = document.getElementById("select-jugador");
      selJ.innerHTML = "";
      BUTANEROS.forEach(j => {
        const opt = document.createElement("option");
        opt.value = j;
        opt.textContent = j;
        selJ.appendChild(opt);
      });

      renderPregunta();
    }

    function renderPregunta() {
      const p = PREGUNTAS[indiceActual];
      const st = estadoRespuestas[indiceActual];

      document.getElementById("selector-pregunta").value = indiceActual;
      document.getElementById("badge-cat").textContent = p.categoria || "General";
      document.getElementById("badge-qid").textContent = st.id;
      document.getElementById("txt-pregunta").textContent = p.pregunta;
      
      document.getElementById("select-jugador").value = st.jugador;

      // Estado de botones de acierto
      document.getElementById("btn-acierto").classList.toggle("active", st.acierto === true);
      document.getElementById("btn-fallo").classList.toggle("active", st.acierto === false);

      // Respuesta oculta por defecto al cambiar
      document.getElementById("box-respuesta").style.display = "none";
      document.getElementById("btn-revelar").style.display = "block";
      document.getElementById("txt-respuesta").textContent = p.respuesta_correcta;
      document.getElementById("txt-host").textContent = p.comentario_host || "Sin comentario del Host.";

      // Botones like/dislike
      document.getElementById("btn-like").classList.toggle("selected-like", st.val === "like");
      document.getElementById("btn-dislike").classList.toggle("selected-dislike", st.val === "dislike");
    }

    function irAPregunta(idx) {
      indiceActual = parseInt(idx, 10);
      renderPregunta();
    }

    function cambiarPregunta(delta) {
      const nuevo = indiceActual + delta;
      if (nuevo >= 0 && nuevo < PREGUNTAS.length) {
        indiceActual = nuevo;
        renderPregunta();
      }
    }

    function asignarJugador(j) {
      estadoRespuestas[indiceActual].jugador = j;
    }

    function marcarAcierto(esAcierto) {
      estadoRespuestas[indiceActual].acierto = esAcierto;
      renderPregunta();
    }

    function toggleRespuesta() {
      document.getElementById("box-respuesta").style.display = "block";
      document.getElementById("btn-revelar").style.display = "none";
    }

    function valorar(tipo) {
      const st = estadoRespuestas[indiceActual];
      st.val = (st.val === tipo) ? "sin_valorar" : tipo;
      renderPregunta();
    }

    // Manejo de Modal de Reporte
    function abrirModalReporte() {
      const st = estadoRespuestas[indiceActual];
      document.querySelectorAll(".tag-chip").forEach(chip => {
        const tag = chip.getAttribute("onclick").match(/'([^']+)'/)[1];
        chip.classList.toggle("active", st.etiquetas.includes(tag));
      });
      document.getElementById("modal-comentario").value = st.comentario;
      document.getElementById("modal-reporte").style.display = "flex";
    }

    function cerrarModalReporte() {
      document.getElementById("modal-reporte").style.display = "none";
    }

    function toggleTag(el, tag) {
      el.classList.toggle("active");
    }

    function guardarReporte() {
      const st = estadoRespuestas[indiceActual];
      const tags = [];
      document.querySelectorAll(".tag-chip.active").forEach(chip => {
        tags.push(chip.getAttribute("onclick").match(/'([^']+)'/)[1]);
      });
      st.etiquetas = tags;
      st.comentario = document.getElementById("modal-comentario").value.trim();
      cerrarModalReporte();
    }

    // Generar bloque JSON compacto con cabecera de texto
    function copiarResumen() {
      const fecha = new Date().toISOString().split("T")[0];
      
      const payload = {
        sesion_id: "sesion_" + Date.now(),
        fecha: fecha,
        partida: estadoRespuestas.map(r => ({
          id: r.id,
          jugador: r.jugador,
          acierto: r.acierto,
          val: r.val,
          etiquetas: r.etiquetas,
          comentario: r.comentario
        }))
      };

      const jsonCompacto = JSON.stringify(payload);
      const salidaFinal = `=== RESUMEN CULTURIZANDO PIBES ===\n${jsonCompacto}`;

      navigator.clipboard.writeText(salidaFinal).then(() => {
        const toast = document.getElementById("toast");
        toast.style.display = "block";
        setTimeout(() => toast.style.display = "none", 2500);
      }).catch(err => {
        alert("Error al copiar: " + err);
      });
    }

    window.onload = init;
  </script>
